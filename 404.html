<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, follow" />
    <meta
      http-equiv="refresh"
      content="0; url=https://docs.rdlabo.dev/projects/capacitor-stripe"
    />
    <link
      rel="canonical"
      href="https://docs.rdlabo.dev/projects/capacitor-stripe"
    />
    <title>Capacitor Community Stripe documentation moved</title>
    <script>
      const legacyPath = location.pathname.replace(/^\/stripe\/?/, "/");
      const docsMatch = legacyPath.match(/^\/docs\/(.+?)\/?$/);
      const target = docsMatch
        ? "https://docs.rdlabo.dev/projects/capacitor-stripe/docs/" +
          docsMatch[1]
        : legacyPath === "/installation" || legacyPath === "/installation/"
          ? "https://docs.rdlabo.dev/projects/capacitor-stripe/docs/configuration"
          : "https://docs.rdlabo.dev/projects/capacitor-stripe";
      location.replace(target + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>
      The documentation has moved to
      <a href="https://docs.rdlabo.dev/projects/capacitor-stripe"
        >Capacitor Community Stripe documentation</a
      >.
    </p>
  </body>
</html>
